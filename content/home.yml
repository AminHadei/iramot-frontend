eyebrow: انجمن مدیریت فناوری و نوآوری ایران
title: انجمن مدیریت فناوری و نوآوری ایران برای پیوند پژوهش، سیاست و عمل در نوآوری شکل گرفته است.
dek: انجمن مدیریت فناوری و نوآوری ایران می‌خواهد بحث نوآوری را از شعار به ظرفیت قابل‌سنجش برساند. پژوهش، آموزش و پیشنهاد سیاست در این‌جا جدا از هم نیستند.
