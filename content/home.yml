journals:
  - title: سیاست علم و فناوری
    href: https://jstp.nrisp.ac.ir
    image: /media/journals/siasate-elm-750x1024-1.webp
    description: فصلنامه «سیاست علم و فناوری» پرسابقه ترین مجله علمی پژوهشی ایران است که در زمینه سیاست‌گذاری و مدیریت علم، فناوری و نوآوری از سال ۱۳۸۷ فعالیت می‌کند. این فصلنامه در همکاری با مرکز تحقیقات سیاست علمی کشور منتشر می‌شود.
  - title: مدیریت نوآوری
    href: https://www.nowavari.ir
    image: /media/journals/modiriat.webp
    description: نشریه مدیریت نوآوری، نشریه‌ای علمی پژوهشی است که در زمینه مطالعات مربوط به حوزه مدیریت نوآوری از ابتدای سال ۱۳۹۱ فعالیت می‌کند. این نشریه در همکاری با موسسه آموزشی و تحقیقاتی صنایع دفاعی منتشر می‌شود.
  - title: مدیریت توسعه فناوری
    href: https://jtdm.irost.ir
    image: /media/journals/411683110107-749x1024-1.webp
    description: فصلنامه علمی مدیریت توسعه فناوری از سال ۱۳۹۲ فعالیت خود را آغاز و به مباحث مهم و به‌روز در زمینه «مدیریت فناوری و نوآوری، که در سطح خرد انجام شده» می‌پردازد. این فصلنامه در همکاری با پژوهشکده مطالعات فناوری‌های نوین سازمان پژوهش‌های علمی و صنعتی ایران منتشر می‌شود.
