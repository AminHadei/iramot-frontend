spotlight:
  heading: کارگروه‌ها
  intro: انجمن مدیریت فناوری و نوآوری ایران سعى دارد تا در راستاى ارتقاء سطح علم و فناوری کشور، به تبیین جایگاه مدیریت فناوری در ایران اقدام نموده و با حمایت از ایجاد و توسعه شبکه متخصصان و تلاش گران عرصه فناوری، به ارتقا و بهبود تصمیم‌گیرى‌هاى مرتبط با این حوزه در سطوح ملى و بنگاه کمک نماید.
