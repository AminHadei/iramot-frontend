committees:
  id: committees
  manager_label: "مدیریت:"
  manager_label_note: label shown before each manager name on https://iramot.ir/committees/
  title: کارگروه های انجمن مدیریت فناوری و نوآوری ایران
  source: https://iramot.ir/committees/ (separate page, menu «کارگروه‌ها»; not under «درباره ما»)
  groups:
    - title: کارگروه ارتباط با اکوسیستم استارتاپی
      body:
        - اکوسیستم استارتاپی ایران، به عنوان یکی از پیشروترین اجزای اکوسیستم نوآوری در ایران، در طی عمر کوتاه خود توانسته تا جایگاهی ویژه را در گفتمان اقتصادی ایران پیدا کند. از همین رو انجمن مدیریت فناوری و نوآوری ایران که اعضایش در شکل‌گیری، سیاست‌گذاری و همچنین هدایت این اکوسیستم نقشی کلیدی داشته‌اند، بر آن شد تا در دوره جدید خود کمیته‌ای مجزا را با هدف ایجاد ارتباط نهادی با اکوسیستم استارتاپی ایران تشکیل دهد. توسعه تعاملات، جاری‌سازی مباحث فناوری در اکوسیستم استارتاپی و انتقال تجربیات اکوسیستم به جامعه مدیریت فناوری از مهم‌ترین ماموریت‌های این کمیته است.
      manager:
        name: صابر خسروی
        photo:
          src: https://iramot.ir/wp-content/uploads/2025/04/saber-khosravi-e1689166246591.webp
          local: img/2025-04-saber-khosravi-e1689166246591.webp
      social: []
      flags:
        - social icon has empty href on source
    - title: کارگروه شبکه‌سازی بین‌المللی
      body:
        - انجمن مدیریت فناوری و نوآوری ایران از طریق کمیته شبکه‌سازی بین‌المللی همواره در تلاش است تا در فضای بین‌الملل، خود را به عنوان یکی از بازیگران جدی فناوری و نوآوری ایران معرفی کند. همچنین با شبکه‌سازی با نهادهای بین‌المللی، مسیر ارتباط میان ذی‌نفعان مدیریت فناوری و نوآوری ایران را با جهان تسهیل کند. علاوه بر این، استفاده از ظرفیت‌های ایرانیان خارج از کشور نیز در دستور کار این کمیته قرار دارد. توسعه تعاملات با نهادها و سازمان‌های مشابه خارجی، شبکه‌سازی با ایرانیان خارج از کشور و انتقال تجربیات بین‌المللی از مهم‌ترین ماموریت‌های این کمیته است.
      manager:
        name: رضا حافظی
        photo:
          src: https://iramot.ir/wp-content/uploads/2025/04/17-1-1024x954-1.webp
          local: img/2025-04-17-1-1024x954-1.webp
      social: []
      flags:
        - social icon has empty href on source
    - title: کارگروه آموزش و توانمندسازی
      body:
        - انجمن مدیریت فناروی و نوآوری ایران در راستای ماموریت اصلی خود یعنی ارتقای سطح علمی کشور اقدام به تشکیل کمیته آموزش و توانمندسازی کرد. این کمیته در تلاش است تا ضمن رصد محتواهای آموزشی موجود در فضای مدیریت فناوری و نوآوری ایران، اقدام به برگزاری دوره‌های آموزشی تخصصی مدیریت فناوری برای سازمان‌ها و نهادهای مختلف کند تا از این طریق دانش مدیریت فناوری و نوآوری ترویج یافته و نیروهای متخصص پرورش یابند. ارتقای سطح علمی مدیریت فناوری در میان فعالین جامعه فناوری و صنعت و توانمندسازی جامعه فناوری و صنعت از مهم‌ترین ماموریت‌های این کمیته است.
      manager:
        name: مریم نوذری
        photo:
          src: https://iramot.ir/wp-content/uploads/2025/04/IMG_0059.webp
          local: img/2025-04-IMG_0059.webp
      social: []
      flags:
        - social icon has empty href on source
    - title: کارگروه استاندارد و اعتباربخشی
      body:
        - مشارکت در تدوین، پیاده‌سازی و کمک به نظارت بر استانداردهای مرتبط با مدیریت فناوری و نوآوری در ایران و ایفای نقش در تعریف و تدوین استانداردهای بین‌المللی، یکی از ماموریت‌های ذاتی انجمن مدیریت فناوری و نوآوری ایران است. به همین منظور در دوره جدید انجمن، کمیته‌ای مجزا برای استانداردسازی و اعتباربخشی تشکیل گردید. مشارکت در تدوین و پیاده‌سازی استانداردهای ملی و بین‌المللی مرتبط با نوآوری و فناوری و تلاش برای ترویج این استانداردها در صنعت با رعایت مقررات سازمان‌های حاکمیتی کشور، از مهم‌ترین ماموریت‌های این کمیته است.
      manager:
        name: سامان روح‌بخشان
        photo:
          src: https://iramot.ir/wp-content/uploads/2025/04/476528-5d4298f6-1.webp
          local: img/2025-04-476528-5d4298f6-1.webp
      social: []
      flags:
        - social icon has empty href on source
    - title: کارگروه ارتباط با صنعت
      body:
        - صنایع مختلف یکی از مهم‌ترین ذی‌نفعان انجمن مدیریت فناوری و نوآوری ایران هستند. لذا تعامل مستمر و شبکه‌سازی با صنعت‌های مختلف یکی از ماموریت‌های اصلی انجمن است. از همین رو، کمیته ارتباط با صنعت در انجمن شکل گرفت. ارتباط مستمر با صنعت، توسعه ارتباط دانشگاه و صنعت، تسهیل شبکه‌سازی فناورانه در میان صنایع از مهم‌ترین ماموریت‌های این کمیته است.
      manager:
        name: سهراب آقازاده
        photo:
          src: https://iramot.ir/wp-content/uploads/2025/04/Sohrab-Aghazadeh.webp
          local: img/2025-04-Sohrab-Aghazadeh.webp
      social: []
      flags:
        - social icon has empty href on source
    - title: کارگروه سیاست‌گذاری و حکمرانی
      body:
        - انجمن مدیریت فناوری و نوآوری ایران از بدو تاسیس به دنبال اثرگذاری در لایه‌های سیاست‌گذاری و حکمرانی فناوری و نوآوری در ایران بوده و از همین رو کمیته‌ای مجزا ماموریت پیگیری این مورد را عهده‌دار است. بهبود نظام سیاست‌گذاری صنعتی و حکمرانی، تسهیل ارتباط بین ذی‌نفعان با نهادهای حکمرانی از مهم‌ترین ماموریت‌های این کمیته است.
      manager:
        name: مصطفی صفدری رنجبر
        photo:
          src: https://iramot.ir/wp-content/uploads/2025/04/1660741687DSC_0884-e1689167200168-1.webp
          local: img/2025-04-1660741687DSC_0884-e1689167200168-1.webp
      social: []
      flags:
        - social icon has empty href on source
    - title: کارگروه ترویج علمی و انتشارات
      body:
        - انجمن مدیریت فناوری و نوآوری ایران به عنوان یک انجمن علمی، همواره در تلاش است تا به ترویج علمی مباحث مرتبط با مدیریت فناوری و نوآوری اهتمام ورزد. همچنین تلاش برای انتشار مهم‌ترین و به‌روزترین مباحث مرتبط، از مهم‌ترین ماموریت‌های انجمن است. به همین منظور کمیته ترویج علمی و انتشارات انجمن تشکیل و مامور این امر مهم شده است. تدوین و انتشار گزارش‌های مرتبط و به‌روز، تالیف و ترجمه ادبیات به‌روز فناوری و استمرار در نشر فصلنامه‌های علمی و پژوهشی از مهم‌ترین ماموریت‌های این کمیته است.
      manager:
        name: کیارش فرتاش
        photo:
          src: https://iramot.ir/wp-content/uploads/2025/04/article-1024x663-1.webp
          local: img/2025-04-article-1024x663-1.webp
      social: []
      flags:
        - social icon has empty href on source
