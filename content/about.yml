statute:
  id: statute
  source_anchor: "#Statute"
  title: اساسنامه انجمن
  chapters:
    - title: "فصل ۱: کلیات و اهداف"
      articles:
        - title: ماده 1 اساسنامه
          content:
            - p: به منظور گسترش و پیشبرد و ارتقای علم و توسعه کمی وکیفی نیروهای متخصص و بهبود بخشیدن به امور آموزشی و پژوهشی در زمینه های مربوط به مدیریت تکنولوژی، انجمن مدیریت فناوری ایران که از این پس در اساسنامه انجمن نامیده می شود، تشکیل می گردد.
        - title: ماده 2 اساسنامه
          content:
            - p: انجمن مؤسسه‌ای غیر انتفاعی است و در زمینه‌های علمی و پژوهشی و فنی فعالیت می‌کند و از تاریخ ثبت دارای شخصیت حقوقی است و رئیس هیئت مدیرهٔ آن (رئیس انجمن) نماینده قانونی انجمن می‌باشد.
        - title: ماده 3 اساسنامه
          content:
            - p: مرکز انجمن در شهر تهران به نشانی میدان ونک، خیابان ملاصدرا، شیراز جنوبی، خیابان سهیل ،انجمن مدیریت فناوری ایران می‌باشد و شعب آن پس از موافقت کمیسیون انجمن‌های علمی می‌تواند در هر منطقه از کشور تشکیل شود.
            - p: "تبصره: هیئت مدیره می‌تواند در صورت لزوم نسبت به تغییر نشانی مرکز اصلی انجمن اقدام نماید به شرط آنکه موضوع در روزنامه رسمی کثیرالانتشار اعلام شود و کتباً به اطلاع کمیسیون انجمن‌های علمی وزارت علوم، تحقیقات و فناوری برسد."
        - title: ماده 4 اساسنامه
          content:
            - p: انجمن از تاریخ تصویب این اساسنامه برای مدت نامحدود تشکیل می‌شود و ملزم به رعایت قوانین جمهوری اسلامی می‌باشد.
    - title: "فصل ۲: وظایف و فعالیت‌ها"
      articles:
        - title: ماده 5 اساسنامه
          content:
            - lines:
                - ۵٫۱ : انجام تحقیقات علمی و فرهنگی در سطح ملی و بین المللی توسط اعضاء و محققان و متخصصانی که به گونه ای با علم مدیریت تکنولوژی سر و کار دارند.
                - ۵٫۲ : همکاری با نهادهای اجرایی، علمی و پژوهشی در زمینه ارزیابی و بازنگری طرح ها و برنامه های مربوط به امور آموزش و پژوهش در زمینه علمی موضوع فعالیت انجمن.
                - ۵٫۳ : ترغیب و تشویق پژوهشگران و تجلیل از محققان و استادان ممتاز در رشته های مرتبط با مدیریت تکنولوژی.
                - ۵٫۴ : ارائه خدمات آموزشی و پژوهشی.
                - ۵٫۵ : تشکیل گردهمایی های علمی در سطح ملی، منطقه ای و بین المللی.
                - ۵٫۶ : انتشار کتب و نشریات علمی.
                - ۵٫۷ : شناسایی و برقراری ارتباط با متخصصین حوزه مدیریت تکنولوژی و ایجاد شبکه صاحبنظران این رشته.
                - ۵٫۸ : تسهیل تبادل نظر و انتقال یافته ها و تجربیات در حوزه مدیریت تکنولوژی.
                - ۵٫۹ : ایجاد زمینه تفاهم و همفکری ارگان های مختلف فعال در مدیریت کلان تکنولوژی کشور.
                - ۵٫۱۰ : کمک به مراکز تصمیم گیری و سیاست گذاری کشور به عنوان یک نهاد مدنی.
                - ۵٫۱۱ : ایجاد زمینه گفتگو و تبادل نظر رشته های مختلف مهندسی و علوم انسانی مرتبط با مدیریت فناوری .
                - ۵٫۱۲ : ارزیابی بنگاه­ها، سازمان­ها و نهادهای فعال در نظام نوآوری کشور و برگزاری مسابقات و اعطای جوایز در راستای ترویج مفاهیم فناوری و نوآوری در لایه های مختلف جامعه
    - title: "فصل ۳: انواع و شرایط عضویت"
      articles:
        - title: ماده 6 اساسنامه
          content:
            - p: "عضویت در انجمن شامل یکی از حالات زیر است:"
            - p: "۶٫۱ : عضویت پیوسته : مؤسسان انجمن و کلیه افرادی که حداقل دارای درجه کارشناسی ارشد در رشته مدیریت فناوری و یا رشته های مرتبط باشند."
            - p: "۶٫۲ : عضویت وابسته : افرادی که دارای درجه کارشـناسی بوده و به نحـوی در رشـته مدیریت فناوری و یا رشته های مرتبط شاغل باشند."
            - p: "۶٫۳ : عضویت دانشجویی : کلیه دانشجویانی که در رشته مدیریت فناوری و یا رشته های مرتبط به تحصیل اشتغال دارند."
            - p: "۶٫۴ : عضویت افتخاری : شخصیت های ایرانی و خارجی که مقام علمی آنان در زمینه های مرتبط با مدیریت فناوری حائز اهمیت خاص باشد، یا در پیشبرد اهداف انجمن کمک های مؤثر و ارزنده ای نموده باشند."
            - p: "۶٫۵ : اعضای مؤسساتی (حقوقی) : سازمانهایی که در زمینه های علمی، پژوهشی و فنی مربوط فعالیت دارند."
            - p: تبصره ۱: افرادی که دارای درجه کارشناسی در یکی از رشته های مرتبط با مدیریت فناوری می باشند، با تصویب هیئت مدیره می توانند به عضویت پیوسته انجمن درآیند.
            - p: تبصره ۲: اعضای مؤسساتی (حقوقی)، به مثابه عضو وابسته انجمن محسوب می شوند.
        - title: ماده 7 اساسنامه
          content:
            - p: هر یک از اعضا بسته به نوع عضویت، سالانه مبلغی را که میزان آن توسط مجمع عمومی تعیین می گردد، به عنوان حق عضویت پرداخت می کنند.
            - p: "تبصره ۱: پرداخت حق عضویت هیچگونه حق و ادعایی نسبت به دارایی انجمن برای عضو ایجاد نمی کند."
            - p: "تبصره ۲: اعضای افتخاری انجمن از پرداخت حق عضویت معاف هستند."
        - title: ماده 8 اساسنامه
          content:
            - p: "عضویت در یکی از این موارد زیر خاتمه می یابد:"
            - p: – استعفای کتبی
            - p: – عدم پرداخت حق عضویت سالانه
            - p: تبصره : تأیید خاتمه عضویت با هیئت مدیره است.
    - title: "فصل ۴: ارکان انجمن"
      articles:
        - title: ماده 9 اساسنامه
          content:
            - p: "ارکان اصلی عبارتند از:"
            - p: "الف : مجمع عمومی"
            - p: "ب: هیئت مدیره"
            - p: "ج: بازرس"
        - title: ماده 10 اساسنامه
          content:
            - p: الف ـ مجمع عمومی
            - p: مجمع عمومی از گردهمایی اعضای پیوسته به صورت عادی یا فوق‎العاده تشکیل می شود.
            - p: "۱۰٫۱ : مجمع عمومی عادی سالی یکبار تشکیل می شود و با حضور یا وکالت کتبی نصف به علاوه یک کل اعضای پیوسته انجمن رسمیت می یابد و کلیه تصمیمات با اکثریت آرا معتبر است."
            - p: "۱۰٫۲ : در صورتی که در دعوت نخست، مجمع عمومی رسمیت نیافت، جلسه دوم به فاصله حداقل بیست روز بعد تشکیل می شود و با هر تعداد حاضر جلسه رسمیت خواهد یافت."
            - p: "۱۰٫۳ : مجمع عمومی فوق العاده در موارد ضروری با دعوت هیئت مدیره یا بازرس و یا با تقاضای کتبی حداقل یک سوم اعضای پیوسته تشکیل می شود."
            - p: "تبصره ۱: دعوت برای تشکیل مجامع عمومی بصورت کتبی یا آگهی در روزنامه کثیرالانتشار است و باید حداقل پانزده روز قبل از تشکیل مجمع به اطلاع اعضای پیوسته برسد."
            - p: "تبصره ۲ : یک سوم اعضای پیوسته می توانند مستقیماً اقدام به دعوت مجمع عمومی فوق العاده نمایند مشروط بر اینکه هیئت مدیره و نیز بازرس انجمن به تقاضای ایشان پاسخ منفی داده باشند و در چنین حالتی، ایشان در آگهی دعوت، به عدم اجابت درخواست خود توسط هیئت مدیره و بازرس تصریح نمایند."
            - p: "تبصره ۳: در صورت تحقق تبصره فوق، دستور جلسه مجمع عمومی منحصراً موضوعی خواهد بود که در تقاضانامه ذکر شده است و هیئت رئیسه از میان اعضا انتخاب خواهد شد."
        - title: ماده 11 اساسنامه
          content:
            - p: "وظایف مجامع عمومی عادی و فوق‎العاده :"
            - lines:
                - "۱۱٫۱ : انتخاب اعضای هیئت مدیره و بازرس."
                - "۱۱٫۲ : تصویب خط مشی انجمن."
                - "۱۱٫۳ : بررسی و تصویب پیشنهادات هیئت مدیره و بازرس."
                - "۱۱٫۴ : تعیین میزان حق عضویت."
                - "۱۱٫۵ : تصویب تغییرات در مفاد اساسنامه."
                - "۱۱٫۶ : عزل هیئت مدیره و بازرس."
                - "۱۱٫۷ : تصویب انحلال انجمن."
                - "۱۱٫۸ : بررسی و تصویب ترازنامه و صورتحساب درآمدها و هزینه های سال مالی گذشته و بودجه سال آتی انجمن."
            - p: "تبصره ۱ : مجامع عمومی توسط هیئت رئیسه ای مرکب از یک رئیس، یک منشی و دو ناظر اداره می شوند."
            - p: "تبصره ۲ : اعضای هیئت رئیسه با اعلام و پذیرش نامزدی خود در مجمع انتخاب می شوند."
            - p: "تبصره ۳ : اعضای هیئت رئیسه نباید از بین کسانی باشند که خود را در انتخابات هیئت مدیره و بازرس کاندیدا کرده اند."
            - p: "تبصره ۴ : مجمع عمومی فوق العاده تنها به منظور تصمیم گیری در موارد بندهای ۵-۱۱ ، ۶-۱۱ ، ۷-۱۱ تشکیل می شود."
        - title: ماده 12 اساسنامه
          content:
            - p: ب ـ هیئت مدیره
            - p: هیئت مدیره انجمن مرکب از ۷ نفر عضو اصلی و ۲ نفر عضو علی البدل می باشد که هر ۳ سال یکبار با رأی مخفی از میان اعضای پیوسته انجمن انتخاب می شوند.
            - p: "۱۲٫۱ : هیچ یک از اعضا نمی‎توانند بیش از دو دوره متوالی به عضویت هیئت مدیره انتخاب شوند."
            - p: "۱۲٫۲ : عضویت در هیئت مدیره افتخاری است."
            - p: "۱۲٫۳ : هیئت مدیره حداکثر تا ۲ هفته پس از انتخاب شدن تشکیل جلسه داده و با رأی کتبی نسبت به تفکیک وظایف خود اقدام می نماید."
            - p: "تبصره ۱ : یکی از اعضای هیئت مدیره به عنوان رئیس هیئت مدیره (رئیس انجمن) توسط هیئت مدیره انتخاب خواهد شد."
            - p: "تبصره ۲ : جهت تسریع در امور انجمن، یکی از اعضای پیوسته انجمن توسط هیئت مدیره به عنوان دبیر انجمن انتخاب می گردد."
            - p: "۱۲٫۴ : کلیه اسناد تعهدآور و اوراق بهادار، با امضای رئیس انجمن و خزانه دار همراه با مهر انجمن و نامه های رسمی با امضای رئیس انجمن یا دبیر انجمن معتبر است."
            - p: "۱۲٫۵ : هیئت مدیره موظف است لااقل هر یک ماه یکبار تشکیل جلسه دهد. فاصله بین ارسال دعوتنامه یا تلفن با تاریخ تشکیل جلسه هیئت مدیره حداقل سه روز است."
            - p: "۱۲٫۶ : جلسات هیئت مدیره با حضور اکثریت اعضا رسمیت می یابد و تصمیمات متخذه با اکثریت آرای حاضر، معتبر است."
            - p: "۱۲٫۷ : کلیه مصوبات هیئت مدیره ثبت و پس از امضای اعضا در دفتر صورتجلسات هیئت مدیره نگهداری می شود."
            - p: "۱۲٫۸ : شرکت اعضای هیئت مدیره در جلسات ضروری است و غیبت هر یک از اعضا بدون عذر موجه به تشخیص هیئت مدیره، تا سه سال متوالی و پنج جلسه متناوب، در حکم استعفای عضو غایب خواهد بود."
            - p: "۱۲٫۹ : در صورت استعفا، برکناری یا فوت هر یک از اعضای هیئت مدیره، عضو علی البدل برای مدت باقی مانده دوره، به جانشینی وی تعیین خواهد شد."
            - p: "۱۲٫۱۰ : شرکت بازرس در جلسات هیئت مدیره بدون داشتن حق رأی مجاز است."
            - p: "۱۲٫۱۱ : هیئت مدیره موظف است ظرف حداقل ۲ ماه پیش از پایان تصدی خود نسبت به فراخونی مجمع عمومی و انتخاب هیئت مدیره جدید اقدام کرده و بلافاصله نتایج را همراه با صورتجلسه مجمع عمومی جهت اطلاع به کمیسیون انجمن های علمی ارسال نماید."
            - p: "تبصره: تا تأیید هیئت مدیره جدید توسط کمیسیون انجمن های علمی، هیئت مدیره قبلی عهده دار مسئولیت امور انجمن خواهد بود."
        - title: ماده 13 اساسنامه
          content:
            - p: "هیئت مدیره عالی ترین نهاد تصمیم گیری انجمن پس از مجمع عمومی بوده و وظایف و اختیارات آن به شرح زیر است:"
            - p: "۱۳٫۱ : اداره امور جاری انجمن طبق اساسنامه و مصوبات مجمع عمومی."
            - p: "۱۳٫۲ : تشکیل گروه های علمی انجمن، تعیین وظایف و نظارت بر فعالیت آنها."
            - p: "۱۳٫۳‌ : هیئت مدیره می تواند هر اقدام و معامله ای را که ضروری بداند در مورد نقل و انتقال غیر منقول و تبدیل به احسن یا ترهین و فک رهن و استقراض به استثنای واگذاری قطعی اموال غیر منقول که مستلزم تصویب مجمع عمومی است، انجام دهد."
            - p: "۱۳٫۴ : جز درباره موضوعاتی که به موجب مفاد اساسنامه اخذ تصمیم و اقدام درباره آنها در صلاحیت خاص مجمع عمومی است، هیئت مدیره کلیه اختیارات لازم برای اداره امور را مشروط به رعایت حدود موضوع فعالیت انجمن دارا می‌باشد."
            - p: "۱۳٫۵ : تهیه گزارش سالانه و تنظیم تراز مالی و صورتحساب درآمدها و هزینه های انجمن برای تصویب در مجمع عمومی و ارائه به مرجع نظارت در موعد مقرر."
            - p: "۱۳٫۶ : اقامه دعوی و پاسخگویی به دعاوی اشخاص حقیقی یا حقوقی در تمام مراجع و مراحل دادرسی با حق تعیین وکیل و حق توکیل به غیر."
            - p: "۱۳٫۷ : انتخاب و معرفی نمایندگان انجمن برای شرکت در مجامع علمی داخلی و خارجی."
            - p: "۱۳٫۸ : اجرای طرح ها و برنامه های علمی در چارچوب وظایف انجمن."
            - p: "۱۳٫۹ : جلب هدایا و کمک های مالی."
            - p: "۱۳٫۱۰ : اهدای بورس های تحقیقاتی و آموزشی."
            - p: "۱۳٫۱۱ : اتخاذ تصمیم در مورد عضویت انجمن در مجامع علمی داخلی و خارجی با رعایت قوانین و مقررات جاری کشور."
        - title: ماده 14 اساسنامه
          content:
            - p: ج ـ بازرس
            - p: مجمع عمومی یک نفر را به عنوان بازرس اصلی و یک نفر را به عنوان علی‎البدل برای مدت دو سال انتخاب می‎نماید.
            - p: "تبصره : انتخاب مجدد بازرس بلامانع است."
        - title: ماده 15 اساسنامه
          content:
            - p: "وظایف بازرس به شرح زیر است :"
            - p: "۱۵٫۱ : بررسی اسناد و دفاتر مالی انجمن و تهیه گزارش برای مجمع عمومی."
            - p: "۱۵٫۲ : بررسی گزارش سالانه هیئت مدیره و تهیه گزارش از عملکرد انجمن برای اطلاع مجمع عمومی."
            - p: "۱۵٫۳ : گزارش هرگونه تخلف هیئت مدیره از مفاد اساسنامه به مجمع عمومی."
            - p: "تبصره : کلیه اسناد و مدارک انجمن اعم از مالی و غیرمالی در هر زمان و بدون قید و شرط باید از سوی هیئت مدیره برای بررسی در دسترس بازرس قرار گیرد."
    - title: "فصل ۵: گروه‌های علمی انجمن"
      articles:
        - title: ماده 16 اساسنامه
          content:
            - p: انجمن می‌تواند گروه‌های تخصصی و کمیته های مورد نیاز را تشکیل داده و این گروه‌ها و کمیته‌ها براساس شرح وظایفی که از سوی هیئت مدیره تعیین می‌شود به فعالیت می‌پردازند.
    - title: "فصل ۶: بودجه و مواد متفرقه"
      articles:
        - title: ماده 17 اساسنامه
          content:
            - p: "منابع مالی انجمن عبارتند از :"
            - p: "۱۷٫۱ : حق عضویت اعضاء."
            - p: "۱۷٫۲ : درآمدهای ناشی از ارائه خدمات آموزشی، پژوهشی، مشاوره ای و مانند آن."
            - p: "۱۷٫۳: دریافت هدایا و کمک ها."
            - p: "تبصره : کلیه عواید و درآمدهای انجمن صرف اهداف موضوع ماده ۵ این اساسنامه خواهد شد."
        - title: ماده 18 اساسنامه
          content:
            - p: درآمدها و هزینه های انجمن در دفاتر قانونی ثبت و شرح آن هر سال پس از تصویب در مجامع عمومی به کمیسیون انجمن های علمی وزارت علوم، تحقیقات و فناوری ارسال می شود.
        - title: ماده 19 اساسنامه
          content:
            - p: کلیه وجوه انجمن در حساب مخصوصی نزد بانکهای کشور نگهداری می شود.
        - title: ماده 20 اساسنامه
          content:
            - p: هیچ یک از مؤسسین یا صاحبان سرمایه حق برداشت یا تخصیص هیچ گونه سودی اعم از سود سهام یا سرمایه را نداشته و خود و وابستگان درجه یک آنها نمی توانند مبادرت به انجام معاملات با مؤسسه نمایند.
        - title: ماده 21 اساسنامه
          content:
            - p: کلیه مدارک و پرونده های مالی و غیرمالی مرتبط با فعالیت های انجمن در محل دفتر مرکزی انجمن نگهداری می شود و در مواقع مراجعه مرجع نظارت یا سایر مراجع صلاحیت دار در اختیار آنان قرار خواهد گرفت.
        - title: ماده 22 اساسنامه
          content:
            - p: رگونه تغییر در مفاد اساسنامه، پس از تصویب کمیسیون انجمن های عملی وزارت علوم، تحقیقات و فناوری معتبر است.
        - title: ماده 23 اساسنامه
          content:
            - p: انجمن تابعیت جمهوری اسلامی ایران را دارد و اعضای آن به نام انجمن حق فعالیت سیاسی و یا وابستگی به گروه ها و احزاب سیاسی را ندارند.
        - title: ماده 24 اساسنامه
          content:
            - p: در صورت تصویب انحلال انجمن توسط مجمع عمومی، همان مجمع هیئت تسویه ای را برای پرداخت دیون و وصول مطالبات انجمن انتخاب خواهد کرد. هیئت تسویه موظف است پس از وصول مطالبات و پرداخت بدهی، کلیه دارایی های منقول و غیرمنقول را با نظر وزارت علوم، تحقیقات و فناوری به یکی از مؤسسات آموزشی و یا پژوهشی کشور واگذار کند.
        - title: ماده 25 اساسنامه
          content:
            - p: این اساسنامه مشتمل بر ۶ فصل، ۲۵ ماده، ۵۵ زیر ماده و ۱۸ تبصره، در جلسه مورخ ۱/۴/۱۳۷۹ هیئت مؤسسین انجمن به تصویب رسید. ضمناً در تاریخ ۹/۱۱/۸۰ بعضی از مفاد آن مورد بازنگری و اصلاح قرار گرفت.
  flags:
    - ماده 22 begins «رگونه تغییر…» (missing «ه») and says «انجمن های عملی» — typos on source, preserved
