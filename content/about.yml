about:
  id: about
  source_anchor: "#aboutAssociation"
  title: درباره انجمن مدیریت فناوری و نوآوری ایران بیشتر بدانید
  body:
    - ایده تأسیس انجمن مدیریت فناوری و نوآوری ایران در دفتر مطالعات فناوری دانشگاه صنعتى شریف و در دوره عالى مدیریت فناوری (پائیز و زمستان ۷۸) شکل گرفت و پس از آن با پیگیری اعضای اولیه، این انجمن از سال ۱۳۸۱ و با مجوز وزارت عتف آغاز به کار کرد.
    - ایجاد شبکه خبرگان حول مباحث فناوری و نوآوری توسط انجمن منجر به تقویت این نهاد علمی شد و از آنجا که اعضای این انجمن همگی از فعالین صنعتی و یا سیاست‌گذاران علم و فناوری در ایران بودند جایگاه انجمن به عنوان یک نهاد تصمیم‌ساز قوت بیشتری گرفت.
    - کسب رتبه برتر در میان انجمن‌ها در ۱۳ سال از تاریخچه این انجمن خود حاکی از پشتوانه عظیم این نهاد دارد.
    - این انجمن در صدد است تا با افزایش و بهبود تعاملات و همکارى‌هاى بین بخشى، به ارائه خدمات آموزشى، اطلاعاتى و مشاوره‌اى مناسب در زمینه مدیریت فناوری اقدام نماید.
  contact_box:
    title: ارتباط با ما
    items:
      - text: 89 158 021-886
        href: tel:02188615889
      - text: 90 158 021-886
        href: tel:02188615890
      - text: iramot.iran@gmail.com
        href: mailto:iramot.iran@gmail.com
missions:
  id: missions
  source_anchor: "#missions"
  title: مأموریت‌های ما
  body:
    - انجمن مدیریت فناوری و نوآوری ایران سعى دارد تا در راستاى ارتقاء سطح علم و فناوری کشور، به تبیین جایگاه مدیریت فناوری در ایران اقدام نموده و با حمایت از ایجاد و توسعه شبکه متخصصان و تلاش گران عرصه فناوری، به ارتقا و بهبود تصمیم‌گیرى‌هاى مرتبط با این حوزه در سطوح ملى و بنگاه کمک نماید. این انجمن در صدد است تا با افزایش و بهبود تعاملات و همکارى‌هاى بین بخشى، به ارائه خدمات آموزشى، اطلاعاتى و مشاوره‌اى مناسب در زمینه مدیریت فناوری اقدام نماید.
  items:
    - title: ارتقای سطح علمی کشور
      text: از طریق برگزاری کنفرانس‌ها و سمینارهای علمی برای ترویج مباحث روز فناوری و نوآوری
      icon:
        src: https://iramot.ir/wp-content/uploads/2025/04/growthw.webp
        local: img/2025-04-growthw.webp
    - title: توسعه کمی و کیفی نیروهای متخصص
      text: از طریق برگزاری کارگاه‌ها و دوره‌های تخصصی مدیریت فناوری و نوآوری برای افراد و سازمان‌ها
      icon:
        src: https://iramot.ir/wp-content/uploads/2025/04/teamw.webp
        local: img/2025-04-teamw.webp
    - title: بهبود امور پژوهشی و آموزشی
      text: از طریق تربیت نیروی متخصص و انتقال دانش و همچنین انتشار فصلنامه‌های علمی-پژوهشی
      icon:
        src: https://iramot.ir/wp-content/uploads/2025/04/diplomaw.webp
        local: img/2025-04-diplomaw.webp
    - title: تشکیل شبکه متخصصان و فعالان
      text: از طریق برگزاری رویدادها و نشست‌های تخصصی و شناسایی و حمایت خبرگان فناوری و نوآوری
      icon:
        src: https://iramot.ir/wp-content/uploads/2025/04/brainstormw.webp
        local: img/2025-04-brainstormw.webp
