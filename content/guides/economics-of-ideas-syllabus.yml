sections:
  - title: نشست نخست
    body: |
      این سرفصل جای‌نگهدار است. موضوع، منبع و تمرین وقتی دوره بسته شد همین‌جا می‌آید.

      تا آن روز این صفحه فقط شکل یک متن بلند را نشان می‌دهد.
  - title: نشست دوم
    body: |
      ادامهٔ برنامه هنوز نوشته نشده است. ترتیب نشست‌ها بعد از بستن دوره مشخص می‌شود.
